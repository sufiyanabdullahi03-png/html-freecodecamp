
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 30px;
    }

    main {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #0f172a;
    }

    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    img {
      width: 130px;
      border-radius: 8px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    span {
      color: red;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <main>
    <h1>Checkout</h1>

    <section>
      <h2>Your Cart</h2>

      <img 
        src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
        alt="A colorful cube item">

      <p>Colorful Cube</p>
      <p>Price: $25.00</p>
      <p><strong>Total: $25.00</strong></p>
    </section>

    <section>
      <h2>Payment Information</h2>

      <form>
        <label for="card-name">
          Cardholder Name
          <span aria-hidden="true">*</span>
        </label>

        <input
          type="text"
          id="card-name"
          name="card-name"
          required
        >

        <label for="card-number">
          Card Number
          <span aria-hidden="true">*</span>
        </label>

        <input
          type="text"
          id="card-number"
          name="card-number"
          required
          aria-describedby="card-number-help"
        >

        <p id="card-number-help">
          Enter your 16-digit card number without spaces or dashes.
        </p>

        <button type="submit">Complete Purchase</button>
      </form>
    </section>
  </main>

</body>
</html>
